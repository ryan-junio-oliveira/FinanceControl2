; Prumo — overrides SOMENTE para desenvolvimento/manutenção local.
; Montado via docker-compose.override.yml como zz-dev.ini (carrega DEPOIS
; do prumo.ini e vence nos conflitos). NUNCA copiar para a imagem de prod.
memory_limit = 512M
max_execution_time = 300
display_errors = On
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
