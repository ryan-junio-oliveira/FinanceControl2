server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # DNS embutido do Docker (re-resolve o `app` após recreates).
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20M;

    # Assets versionados: cache longo
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Via variável + resolver embutido do Docker: o IP do `app` é
        # re-resolvido a cada ~10s. Sem isso, o nginx resolve `app:9000` uma
        # única vez no boot e dá 502 sempre que o app é recriado (IP novo).
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
