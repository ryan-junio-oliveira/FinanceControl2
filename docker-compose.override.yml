# Override carregado AUTOMATICAMENTE pelo Compose ao lado do
# docker-compose.yml (somente ambiente local/manutenção).
# Efeito: o código daqui (./app, ./routes, ...) vale na hora dentro dos
# containers, sem rebuild. Produção: deploy com `up -d --build` IGNORANDO
# este arquivo (`docker compose -f docker-compose.yml up -d --build`).

services:
  app:
    volumes:
      - .:/var/www
      - /var/www/vendor
      # Mesmo build do host (ver docker-compose.yml): `npm run build` reflete
      # na hora no app e no nginx, sem rebuild da imagem.
      - ./public/build:/var/www/public/build
      # Cache Laravel do container (sem deps dev): sem isso, o
      # bootstrap/cache do host (com providers dev, ex. Pail) sombreia o da
      # imagem e o boot quebra com "Class not found".
      - /var/www/bootstrap/cache
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  worker:
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache

  worker-redis:
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache

  scheduler:
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache
